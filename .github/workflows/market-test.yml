name: Market API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Twelve Data
        env:
          API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          curl -s "https://api.twelvedata.com/time_series?symbol=EUR/USD&interval=1min&outputsize=5&apikey=$API_KEY"
